[project]
name = "wha"
version = "0.1.0"
description = "Wearable health early warning agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "python-dotenv>=1,<2",
    "apscheduler>=3.10,<4",
    "sentence-transformers>=3,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "rank-bm25>=0.2,<1",
    "lxml>=5,<7",
    "streamlit>=1.40,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov",
    "ruff",
    "freezegun",
    "pypdf>=6.16.2",
]

[project.scripts]
wha = "wha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
