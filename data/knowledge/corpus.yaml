- doc_id: evidence_probe_travel
  title: Why this system asks about Travel, time-zone change or altitude
  layer: 4
  source_url: data/knowledge/probes.yaml
  licence: Ours
  text: '# Why this system asks about Travel, time-zone change or altitude


    This question exists to resolve one thing: whether travel, time-zone change or altitude
    is contributing to the raised reading. The wording is written fresh each time, so it will
    not arrive in the same words twice, but the choices offered are fixed because the numbers
    below are defined over them.


    ## What you are asked, and what you can answer


    The question is along the lines of: Have you flown or changed time zone in the last week?


    The answers offered are: No, Yes, a short trip, or Yes, and a time-zone change.


    ## How much each answer moves the belief


    Probability of each answer if travel, time-zone change or altitude IS contributing, against
    the probability of the same answer if it is not:


    - "No": 0.04 if present, 0.97 if absent.

    - "Yes, a short trip": 0.36 if present, 0.02 if absent.

    - "Yes, and a time-zone change": 0.60 if present, 0.01 if absent.


    ## How reliable these numbers are


    Provenance: ASSUMED. These are not measured values. No published study quantifies how
    accurately a person reports drinking, stress, sleep or early symptoms to an app when prompted
    the next morning, so this row is an explicit assumption, set deliberately flat so that
    it understates how informative the question is and the system interrupts less rather than
    more.


    Recall is near-perfect for travel, so `present` is sharp. Rarely worth asking, because
    the base rate is low and the expected value of sample information will usually be near
    zero. It exists so the arithmetic can decide that, rather than the option being absent.'
  metadata:
    topic: probe_evidence
    probe_id: probe_travel
    cause_id: travel
    provenance: ASSUMED
- doc_id: evidence_probe_medication
  title: Why this system asks about Medication started, stopped or missed
  layer: 4
  source_url: data/knowledge/probes.yaml
  licence: Ours
  text: '# Why this system asks about Medication started, stopped or missed


    This question exists to resolve one thing: whether medication started, stopped or missed
    is contributing to the raised reading. The wording is written fresh each time, so it will
    not arrive in the same words twice, but the choices offered are fixed because the numbers
    below are defined over them.


    ## What you are asked, and what you can answer


    The question is along the lines of: Have you started, stopped or missed any regular medication
    recently?


    The answers offered are: No, Started something new, or Stopped or missed a dose.


    ## How much each answer moves the belief


    Probability of each answer if medication started, stopped or missed IS contributing, against
    the probability of the same answer if it is not:


    - "No": 0.05 if present, 0.96 if absent.

    - "Started something new": 0.50 if present, 0.02 if absent.

    - "Stopped or missed a dose": 0.45 if present, 0.02 if absent.


    ## How reliable these numbers are


    Provenance: ASSUMED. These are not measured values. No published study quantifies how
    accurately a person reports drinking, stress, sleep or early symptoms to an app when prompted
    the next morning, so this row is an explicit assumption, set deliberately flat so that
    it understates how informative the question is and the system interrupts less rather than
    more.


    Asked once at setup and then only on a suspected change. Recall for starting a medication
    is good; recall for a missed dose is worse, which the split encodes.'
  metadata:
    topic: probe_evidence
    probe_id: probe_medication
    cause_id: medication
    provenance: ASSUMED
