- doc_id: evidence_probe_symptoms
  title: Why this system asks about Infection-like immune activation
  layer: 4
  source_url: data/knowledge/probes.yaml
  licence: Ours
  text: '# Why this system asks about Infection-like immune activation


    This question exists to resolve one thing: whether infection-like immune activation is
    contributing to the raised reading. The wording is written fresh each time, so it will
    not arrive in the same words twice, but the choices offered are fixed because the numbers
    below are defined over them.


    ## What you are asked, and what you can answer


    The question is along the lines of: How are you feeling?


    The answers offered are: Nothing unusual, Throat or nose, Feverish or chills, Aches or
    heavy limbs, or Something else.


    ## How much each answer moves the belief


    Probability of each answer if infection-like immune activation IS contributing, against
    the probability of the same answer if it is not:


    - "Nothing unusual": 0.15 if present, 0.80 if absent.

    - "Throat or nose": 0.30 if present, 0.07 if absent.

    - "Feverish or chills": 0.25 if present, 0.03 if absent.

    - "Aches or heavy limbs": 0.20 if present, 0.05 if absent.

    - "Something else": 0.10 if present, 0.05 if absent.


    ## How reliable these numbers are


    Provenance: ASSUMED. These are not measured values. No published study quantifies how
    accurately a person reports drinking, stress, sleep or early symptoms to an app when prompted
    the next morning, so this row is an explicit assumption, set deliberately flat so that
    it understates how informative the question is and the system interrupts less rather than
    more.


    Symptoms carry the discriminating information sensors lack, so this is usually the highest-value
    probe. The `present` row allows 15 percent for a genuinely pre-symptomatic infection,
    which is the regime the whole project targets, so this probe is deliberately NOT decisive
    on its own.'
  metadata:
    topic: probe_evidence
    probe_id: probe_symptoms
    cause_id: infection
    provenance: ASSUMED
- doc_id: evidence_probe_alcohol
  title: Why this system asks about Alcohol
  layer: 4
  source_url: data/knowledge/probes.yaml
  licence: Ours
  text: '# Why this system asks about Alcohol


    This question exists to resolve one thing: whether alcohol is contributing to the raised
    reading. The wording is written fresh each time, so it will not arrive in the same words
    twice, but the choices offered are fixed because the numbers below are defined over them.


    ## What you are asked, and what you can answer


    The question is along the lines of: Did you have any alcohol last night?


    The answers offered are: None, or Yes.


    ## How much each answer moves the belief


    Probability of each answer if alcohol IS contributing, against the probability of the
    same answer if it is not:


    - "None": 0.10 if present, 0.92 if absent.

    - "Yes": 0.90 if present, 0.08 if absent.


    ## How reliable these numbers are


    Provenance: ASSUMED. These are not measured values. No published study quantifies how
    accurately a person reports drinking, stress, sleep or early symptoms to an app when prompted
    the next morning, so this row is an explicit assumption, set deliberately flat so that
    it understates how informative the question is and the system interrupts less rather than
    more.


    Under-reporting is well documented in the general self-report literature but has not been
    quantified for a next-morning app prompt. The 10 percent "none" given present encodes
    both under-reporting and recall error. The two rows are the previous four with the three
    drinking options summed, which is the only merge that leaves the belief unchanged for
    anyone who would have answered any of them.'
  metadata:
    topic: probe_evidence
    probe_id: probe_alcohol
    cause_id: alcohol
    provenance: ASSUMED
- doc_id: evidence_probe_exertion
  title: Why this system asks about Unrecorded or under-recorded exertion
  layer: 4
  source_url: data/knowledge/probes.yaml
  licence: Ours
  text: '# Why this system asks about Unrecorded or under-recorded exertion


    This question exists to resolve one thing: whether unrecorded or under-recorded exertion
    is contributing to the raised reading. The wording is written fresh each time, so it will
    not arrive in the same words twice, but the choices offered are fixed because the numbers
    below are defined over them.


    ## What you are asked, and what you can answer


    The question is along the lines of: Did you do anything physically hard yesterday that
    your watch might have missed?


    The answers offered are: No, Something light, Yes, hard, or Yes, and late in the evening.


    ## How much each answer moves the belief


    Probability of each answer if unrecorded or under-recorded exertion IS contributing, against
    the probability of the same answer if it is not:


    - "No": 0.08 if present, 0.85 if absent.

    - "Something light": 0.17 if present, 0.11 if absent.

    - "Yes, hard": 0.40 if present, 0.03 if absent.

    - "Yes, and late in the evening": 0.35 if present, 0.01 if absent.


    ## How reliable these numbers are


    Provenance: ASSUMED. These are not measured values. No published study quantifies how
    accurately a person reports drinking, stress, sleep or early symptoms to an app when prompted
    the next morning, so this row is an explicit assumption, set deliberately flat so that
    it understates how informative the question is and the system interrupts less rather than
