- doc_id: method_detection_thresholds
  title: What counts as an elevated night
  layer: 2
  source_url: src/wha/constants.py
  licence: Ours
  text: '# What counts as an elevated night


    A night is called elevated when the resting heart rate measured during sleep sits at least
    3 bpm above the person''s own baseline, and is called RED at 4 bpm above it. An investigation
    opens only when 2 consecutive nights are RED. That is the published rule exactly, and
    one RED night on its own never opens anything.


    ## Where these numbers come from


    Alavi et al. 2022, Nature Medicine 28:175-184 (NightSignal). That study reports 3 bpm
    as the threshold because, across its participants, the median fluctuation of the median
    of average overnight resting heart rate over three months was only three bpm, so a 3 bpm
    move is the point at which a change stops looking like ordinary night-to-night variation.
    Its red state requires the overnight resting heart rate to be at least four bpm above
    the baseline on two consecutive nights.


    In a cohort of 3,318 participants of whom 84 were infected, that alerting system flagged
    67 of the 84, which is 80 percent, with pre-symptomatic signals at a median of three days
    before symptoms began.


    ## What is deliberately not looked for


    Only nights above the range are looked into. Infection raises resting heart rate; a low
    one is usually fitness or good rest. This system does not look for conditions that lower
    it.


    A night with fewer than 180 minutes of measured sleep is not scored at all, because a
    reading taken over a fragment of a night is not comparable with one taken over a whole
    night.'
  metadata:
    topic: detection
    citation: Alavi et al. 2022, Nature Medicine 28:175-184 (NightSignal)
- doc_id: method_personal_baseline
  title: The baseline is the person's own, not the population's
  layer: 2
  source_url: src/wha/constants.py
  licence: Ours
  text: '# The baseline is the person''s own, not the population''s


    Once 7 usable nights exist, the centre a night is compared against is the person''s own
    median sleeping resting heart rate. Below that count nothing is flagged at all, because
    a median over one or two nights is noise.


    ## Why seven, and why not blended


    Alavi et al. 2022, Nature Medicine 28:175-184 (NightSignal): per-individual streaming
    median, baseline established for over 80 percent of participants within seven nights.
    The same study that supplies the 3 and 4 bpm thresholds defines its baseline as the streaming
    median of average overnight resting heart rate for each individual, with no population
    blending, and reports that for over 80 percent of participants the proper baseline was
    observed after only seven nights.


    Applying thresholds derived that way to a centre pulled toward a population average is
    a category error. Someone whose true sleeping resting heart rate is 45 bpm would carry
    a permanent negative residual and need a rise far larger than any infection produces before
    anything was noticed; someone at 80 bpm would sit above the threshold while perfectly
    healthy.


    ## The cold start


    Before seven nights the centre is shrunk toward a population mean of 62.75 bpm. That figure
    is an average of 525 adults wearing an Oura ring, reported in Bloomfield et al. 2024,
    PLOS Digital Health 3(4):e0000473. They were first-year university students, so it is
    a starting guess rather than a description of any particular person, and it stops mattering
    once the person''s own nights arrive.


    The WIDTH of the band shrinks toward a different number, 3.71 bpm, and the distinction
    matters. The 8.64 bpm standard deviation in that same paper is how much 525 different
    people differ from EACH OTHER. The width of this band is how much ONE person differs from
    THEMSELVES between nights, which was measured at 3.71 bpm across 107 participants and
    8,508 nights of the Mishra et al. 2020 cohort. Using the first for the second made every
    band about a third too wide.'
  metadata:
    topic: baseline
    citation: 'Alavi et al. 2022, Nature Medicine 28:175-184 (NightSignal): per-individual
      streaming median, baseline established for over 80 percent of participants within seven
      nights'
- doc_id: method_night_window
  title: Why the reading is taken from recorded sleep
  layer: 2
  source_url: src/wha/constants.py
  licence: Ours
  text: '# Why the reading is taken from recorded sleep


    The night''s number is computed over the sleep the watch actually recorded, not over a
    fixed clock window, and daytime naps are excluded rather than pooled with overnight sleep.


    ## Why sleep rather than the whole day


    Daytime heart rate mostly measures what a person was doing. Standing up, coffee or a flight
    of stairs move it by tens of beats per minute, while an infection moves it by roughly
    1.6 to 5. Sleep is the closest a wrist device gets to a controlled measurement: one posture,
    no volitional input, at roughly the same point in the day.


    Mishica et al. 2022, PLoS One 17(1):e0262333, nocturnal versus morning heart rate measures,
    states that during sleep individuals are no longer affected by external stimuli and therefore
    enhanced reliability may exist for recordings that occur during sleep. That study is eleven
    adolescent endurance athletes, which is a narrow basis, and its own variability result
    is reported by its authors as contrary to what they expected. It is quoted here with that
    limitation attached.


    ## Why naps are excluded


    Whitehurst, Naji and Mednick 2018, Neurobiology of Sleep and Circadian Rhythms 5:52-57.
    Thirty-two adults, within-subjects, with polysomnography and ECG, comparing a daytime
    nap against a night of sleep. RR intervals were longer and heart rate lower during nighttime
    sleep than during the nap, in both stage 2 and slow wave sleep. Pooling the two would
    mix distributions with different means and bias a night''s reading by however much the
    person happened to nap.


    ## What the device can and cannot be trusted for


    Dial et al. 2025, Physiological Reports 13:e70527 validated nocturnal resting heart rate
    and heart rate variability from consumer wearables against an ECG reference, over 13 adults
    and 536 nights. Agreement ranged from good to poor depending on the device. The five devices
    tested were a Garmin Fenix 6, two generations of Oura ring, a Polar Grit X Pro and a Whoop
    4.0. The watch this system reads was not among them, so its nocturnal accuracy has not
    been independently validated.


    Consumer sleep staging is also not polysomnography. A night whose staging is wrong yields
    a measurement window that is wrong, and there is no cross-check for that here.'
  metadata:
    topic: measurement_window
    citation: Whitehurst, Naji and Mednick 2018, Neurobiology of Sleep and Circadian Rhythms
      5:52-57; Mishica et al. 2022, PLoS One 17(1):e0262333, nocturnal versus morning heart
      rate measures
