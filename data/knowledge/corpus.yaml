  text: '# Chest pain or pressure


    This is an urgent sign. One report of it is enough, and it goes straight to an urgent
    escalation without passing through any reasoning about how likely anything is.


    ## What to do


    Chest pain or pressure needs assessment now. Call 995 or go to an A&E.


    ## Why this is on the urgent list


    Cannot be excluded from wearable data, and it is time-critical.


    ## How people describe it


    People describe this as chest pain, chest pressure, chest tightness, pain in my chest,
    tight chest, crushing, elephant on my chest, or band around my chest.'
